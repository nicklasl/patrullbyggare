name: Prepare CSV
description: Set up Node.js and decode a Base64 CSV input

inputs:
  csv-base64:
    description: Base64-encoded CSV data
    required: true

outputs:
  csv-path:
    description: Path to the decoded CSV file
    value: ${{ steps.decode.outputs.csv-path }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Decode CSV
      id: decode
      shell: bash
      env:
        CSV_BASE64: ${{ inputs.csv-base64 }}
      run: |
        csv_path="$RUNNER_TEMP/scouter.csv"
        if ! printf '%s' "$CSV_BASE64" | base64 --decode > "$csv_path"; then
          echo "::error::CSV-indatan är inte giltig Base64."
          exit 1
        fi
        echo "csv-path=$csv_path" >> "$GITHUB_OUTPUT"
