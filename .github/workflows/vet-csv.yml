name: Vet CSV
run-name: Vet CSV

on:
  workflow_dispatch:
    inputs:
      csv_base64:
        description: Base64-encoded CSV exported from Google Sheets
        required: true
        type: string

permissions:
  contents: read

jobs:
  vet-csv:
    name: Vet CSV
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare CSV
        id: input
        uses: ./.github/actions/prepare-csv
        with:
          csv-base64: ${{ inputs.csv_base64 }}

      - name: Vet CSV
        shell: bash
        env:
          CSV_PATH: ${{ steps.input.outputs.csv-path }}
        run: |
          set +e
          npm run lint:csv -- "$CSV_PATH" 2>&1 | tee "$RUNNER_TEMP/csv-lint.log"
          status=${PIPESTATUS[0]}

          {
            echo "## CSV validation"
            echo '```text'
            cat "$RUNNER_TEMP/csv-lint.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
